name: Bug report
description: A skill misbehaves, gives wrong guidance, or doesn't trigger
title: "bug: <short summary>"
labels: ["bug"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - deep-research
        - design-stack-picker
        - google-ads
        - google-feed-ops
        - google-grey-ops
        - js-obfuscation
        - knowledge-delta-skill-architect
        - measurement-experimentation-ops
        - meta-ads
        - meta-grey-ops
        - normcore-web
        - responsive-adapter
        - secure-coding
        - senior-buyer-ops
        - tracker-ops
        - web-scraping
        - other / not sure
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Agent / tool
      description: Where you ran it.
      placeholder: Claude Code, Cursor, Gemini CLI, ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected vs. what happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The prompt you used and any relevant project context.
    validations:
      required: true
