name: New skill proposal
description: Suggest a new skill for the library
title: "skill: <short name>"
labels: ["new-skill"]
body:
  - type: input
    id: name
    attributes:
      label: Skill name
      description: Lowercase, hyphen-separated (becomes the directory name).
      placeholder: pdf-form-filler
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: The task an agent should handle better with this skill.
    validations:
      required: true
  - type: textarea
    id: triggers
    attributes:
      label: When should it trigger?
      description: Example prompts or symptoms that should make an agent reach for it.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Bundled scripts/references, prior art, edge cases.
    validations:
      required: false
